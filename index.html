<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>All quiet on the road</title>
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;color:#eef2f7;background:linear-gradient(160deg,#0f172a 0%,#1e293b 45%,#7c2d12 120%);padding:24px;overflow:hidden}
.sky{position:fixed;inset:0;pointer-events:none}
.sky i{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.6;animation:tw 4s infinite ease-in-out}
@keyframes tw{50%{opacity:.1}}
.card{position:relative;max-width:440px;width:100%;text-align:center;padding:44px 32px;border-radius:28px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);box-shadow:0 30px 80px rgba(0,0,0,.35)}
.plane{font-size:56px;display:inline-block;animation:fly 6s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
h1{font-size:28px;font-weight:700;margin:18px 0 10px;letter-spacing:-.02em}
p{color:#cbd5e1;line-height:1.55;font-size:16px}
.pill{display:inline-flex;align-items:center;gap:8px;margin-top:26px;padding:8px 16px;border-radius:999px;background:rgba(34,197,94,.12);color:#86efac;font-size:13px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.7);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.foot{margin-top:22px;font-size:12px;color:#64748b}
</style></head><body>
<div class="sky" id="sky"></div>
<main class="card">
<div class="plane">✈️</div>
<h1>Wheels down, bags unpacked</h1>
<p>No trip in motion right now. When the next adventure takes off, the live itinerary will land right here.</p>
<div class="pill"><span class="dot"></span>All quiet · no current updates</div>
<div class="foot" id="clk"></div>
</main>
<script>
const s=document.getElementById('sky');for(let i=0;i<60;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.top=Math.random()*70+'%';e.style.animationDelay=Math.random()*4+'s';s.appendChild(e)}
const f=(z)=>new Intl.DateTimeFormat('en-GB',{timeZone:z,hour:'2-digit',minute:'2-digit'}).format(new Date());
const t=()=>document.getElementById('clk').textContent='Lisbon '+f('Europe/Lisbon')+' · Zurich '+f('Europe/Zurich');t();setInterval(t,30000);
</script></body></html>
